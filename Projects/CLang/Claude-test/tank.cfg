# Linker config for the tank game - based on ..\HB128\dolo128.cfg
#
#   $0D00-$77FF  program code, data and BSS (checked in gfx.s)
#   $7800-$8FFF  background buffer (static graphics, same layout as FB)
#   $9000-$97FF  C stack (grows down from $9800)
#   $9C00-$9EFF  dirty cell map (768 bytes)
#   $A000-$B7FF  RAM framebuffer (6144 bytes, same layout as VDP patterns)
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800;
}
MEMORY {
    ZP:    define = yes, start = $0091, size = $0046;
    RAM:   define = yes, start = $0d00, size = $9800 - $0d00;
    BG:    start = $7800, size = $1800;
    DIRTY: start = $9C00, size = $0300;
    FB:    start = $A000, size = $1800;
}
SEGMENTS {
    STARTUP:    load = RAM, type = ro;
    ONCE:       load = RAM, type = ro, optional = yes;
    INIT:       load = RAM, type = ro, define = yes, optional = yes;
    CODE:       load = RAM, type = ro;
    RODATA:     load = RAM, type = ro;
    DATA:       load = RAM, type = rw, define = yes;
    BSS:        load = RAM, type = bss, define = yes;
    ZEROPAGE:   load = ZP, type = zp;
    BGBUF:      load = BG, type = bss;
    DIRTYBUF:   load = DIRTY, type = bss;
    FBUF:       load = FB, type = bss;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
